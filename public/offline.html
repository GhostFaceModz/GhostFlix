<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline — GhostFlix</title>
<meta name="theme-color" content="#04050a">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;background:#04050a;color:#e6edf5;font-family:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 0 40px rgba(95,227,255,.25)}
  h1{font-size:clamp(24px,6vw,34px);margin:22px 0 8px;font-weight:800}
  p{color:#9aa6b6;max-width:30em;margin:0 auto 22px;line-height:1.5}
  a{display:inline-block;padding:12px 22px;border-radius:999px;background:linear-gradient(135deg,#5fe3ff,#2a8cff);color:#04121a;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main>
  <div>
    <img src="/icons/icon-192.png" alt="" width="96" height="96">
    <h1>You're offline</h1>
    <p>GhostFlix needs an internet connection to browse and play. Check your connection, then try again.</p>
    <a href="/">Try again</a>
  </div>
</main>
</body>
</html>
